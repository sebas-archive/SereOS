set timeout=2
set default=0
insmod all_video

menuentry "SereOS 1.0 - SereOS Desktop" {
	set gfxmode=1024x768x32,1280x1024x32,800x600x32,1280x720x32,auto
	set gfxpayload=keep
	multiboot /boot/sereos.bin
	boot
}

menuentry "SereOS 1.0 - modo texto (diagnostico)" {
	set gfxpayload=text
	multiboot /boot/sereos-text.bin
	boot
}
