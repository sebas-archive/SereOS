<text x="640.0" y="441.2" text-anchor="middle" font-family="Inter" font-weight="700" font-size="22" fill="#1E3A8A">.data y .bss  (19,2 MiB)</text>
<text x="640.0" y="473.7" text-anchor="middle" font-family="Inter" font-size="21" fill="#374151">heap 8 MiB, backbuffer, bitmaps</text>
