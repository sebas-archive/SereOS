<text x="640.0" y="841.2" text-anchor="middle" font-family="Inter" font-weight="700" font-size="22" fill="#14532D">Libre  (1 MiB)</text>
<text x="640.0" y="873.7" text-anchor="middle" font-family="Inter" font-size="21" fill="#374151">marcos disponibles</text>
