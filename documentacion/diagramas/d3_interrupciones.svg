<text x="60" y="708.2" text-anchor="start" font-family="Inter" font-size="22" fill="#374151">32 = PIT, 33 = teclado</text>
<text x="60" y="736.8" text-anchor="start" font-family="Inter" font-size="22" fill="#374151">44 = ratón</text>
