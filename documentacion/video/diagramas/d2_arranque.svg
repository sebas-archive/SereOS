<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><defs><marker id="ah" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7d8799"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#0a0d14"/></linearGradient></defs><rect width="1920" height="1080" fill="url(#bg)"/>
<text x="120" y="120" font-family="Inter, Noto Sans, sans-serif" font-size="26" font-weight="600" fill="#4f8cff" letter-spacing="4">ARRANQUE</text>
<text x="120" y="176" font-family="Inter, Noto Sans, sans-serif" font-size="54" font-weight="700" fill="#e8edf5">De GRUB al escritorio</text><rect x="120" y="470" width="300" height="170" rx="22" fill="#131a26" stroke="#4f8cff" stroke-width="3"/><text x="270.0" y="565.0" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="34" font-weight="600" fill="#e8edf5">GRUB 2</text><text x="270" y="520" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="22" fill="#7d8799">menú y carga</text><text x="270" y="554" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="22" fill="#7d8799">Multiboot</text><line x1="420" y1="555" x2="470" y2="555" stroke="#7d8799" stroke-width="3" marker-end="url(#ah)"/><rect x="490" y="470" width="300" height="170" rx="22" fill="#131a26" stroke="#4f8cff" stroke-width="3"/><text x="640.0" y="565.0" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="34" font-weight="600" fill="#e8edf5">boot.s</text><text x="640" y="520" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="22" fill="#7d8799">cabecera Multiboot</text><text x="640" y="554" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="22" fill="#7d8799">pila inicial</text><line x1="790" y1="555" x2="840" y2="555" stroke="#7d8799" stroke-width="3" marker-end="url(#ah)"/><rect x="860" y="470" width="300" height="170" rx="22" fill="#131a26" stroke="#5ee0b8" stroke-width="3"/><text x="1010.0" y="565.0" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="34" font-weight="600" fill="#e8edf5">kernel_main</text><text x="1010" y="520" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="22" fill="#7d8799">inicialización</text><text x="1010" y="554" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="22" fill="#7d8799">en orden</text><line x1="1160" y1="555" x2="1210" y2="555" stroke="#7d8799" stroke-width="3" marker-end="url(#ah)"/><rect x="1230" y="470" width="300" height="170" rx="22" fill="#131a26" stroke="#48c7e6" stroke-width="3"/><text x="1380.0" y="565.0" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="34" font-weight="600" fill="#e8edf5">Splash</text><text x="1380" y="520" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="22" fill="#7d8799">logo oficial</text><text x="1380" y="554" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="22" fill="#7d8799">SereOS</text><line x1="1530" y1="555" x2="1580" y2="555" stroke="#7d8799" stroke-width="3" marker-end="url(#ah)"/><rect x="1600" y="470" width="300" height="170" rx="22" fill="#131a26" stroke="#f5b54a" stroke-width="3"/><text x="1750.0" y="565.0" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="34" font-weight="600" fill="#e8edf5">Escritorio</text><text x="1750" y="520" text-anchor="middle" font-family="Inter, Noto Sans, sans-serif" font-size="22" fill="#7d8799">GUI_LOOP</text><text x="120" y="740" font-family="Inter, Noto Sans, sans-serif" font-size="26" fill="#e8edf5">kernel_main inicializa en orden: GDT → IDT/PIC → PIT → teclado → ratón → RTC → framebuffer</text><text x="120" y="784" font-family="Inter, Noto Sans, sans-serif" font-size="26" fill="#e8edf5">→ paginación PSE → heap → RAMFS → planificador → interrupciones → motor gráfico → GUI</text><text x="120" y="860" font-family="Inter, Noto Sans, sans-serif" font-size="22" fill="#7d8799">Alternativa: entrada «modo texto (diagnóstico)» en el mismo GRUB.</text></svg>